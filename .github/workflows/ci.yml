name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # минимальные права GITHUB_TOKEN (CodeQL: missing-workflow-permissions)

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Линт воркфлоу (actionlint)
        # Харденинг после аудита 2026-10-28 (INFRA-1): его диагноз «branches:
        # ain]» оказался артефактом извлечения текста — git-объекты и реальные
        # запуски CI (event=push на main) показывают корректный branches:
        # [main] с первого коммита. Шаг оставлен как страховка от настоящих
        # синтаксических дефектов воркфлоу.
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.7 /tmp
          /tmp/actionlint -color

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Версия синхронна (VER-1, аудит 2026-10-28)
        run: python3 scripts/check_version.py

      - name: Локализация (gen-l10n)
        run: flutter gen-l10n

      - name: Анализ (ошибки + info)
        run: flutter analyze --fatal-infos

      - name: Юнит-тесты
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee /tmp/test_output.log
          # TEST-3 (аудит 2026-10-28, v0.6.2): фактический счётчик тестов
          # публикуется артефактом — README больше не хранит число,
          # которое нельзя проверить.
          N=$(grep -oE '\+[0-9]+' /tmp/test_output.log | tail -1 | cut -c2-)
          echo "$N" > test_count.txt
          echo "Всего тестов: $N"

      - name: Артефакт со счётчиком тестов (TEST-3)
        uses: actions/upload-artifact@v4
        with:
          name: test_count
          path: test_count.txt
          if-no-files-found: error
