name: Release

# Релиз по тегу: analyze + тесты → подписанный APK → GitHub Release.
# Ключ подписи не хранится в репозитории: он приходит из секретов
# KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEYSTORE_KEY_ALIAS /
# KEYSTORE_KEY_PASSWORD (см. раздел «Подпись и релизы» в README).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка подписанного APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Локализация (gen-l10n)
        run: flutter gen-l10n

      - name: Анализ (ошибки + info)
        run: flutter analyze --fatal-infos

      - name: Юнит-тесты
        run: flutter test

      - name: Восстановление ключа подписи (из Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Сборка подписанного APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Публикация GitHub Release (пре-релиз)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          NAME="SmartFridge-${GITHUB_REF_NAME#v}.apk"
          mv "$APK" "build/app/outputs/flutter-apk/$NAME"
          gh release create "$GITHUB_REF_NAME" \
            "build/app/outputs/flutter-apk/$NAME" \
            --title "Умный Холодильник $GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes
