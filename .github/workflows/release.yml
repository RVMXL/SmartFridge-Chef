name: Release

# Релиз по тегу: analyze + тесты → подписанный APK → GitHub Release.
# Ключ подписи не хранится в репозитории — он приходит из секретов
# KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEYSTORE_KEY_ALIAS / KEYSTORE_KEY_PASSWORD.
# Тело релиза — секция версии из CHANGELOG.md (шаг «Тело релиза из CHANGELOG.md»).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка подписанного APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история и теги: нужен git describe для ссылки Full Changelog

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Локализация (gen-l10n)
        run: flutter gen-l10n

      - name: Анализ (ошибки + info)
        run: flutter analyze --fatal-infos

      - name: Юнит-тесты
        run: flutter test

      - name: Восстановление ключа подписи (из Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Fail fast: без ключа Gradle молча подписал бы APK случайным
          # debug-ключом раннера — обновления поверх перестали бы ставиться.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 пуст — отменяю сборку, иначе APK получит случайную debug-подпись"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          if ! keytool -list -keystore android/app/upload-keystore.jks \
                 -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Ключ подписи не читается с KEYSTORE_PASSWORD — проверь секреты"
            exit 1
          fi
          echo "Ключ подписи OK, отпечаток сертификата:"
          keytool -list -v -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" | grep 'SHA256:'

      - name: Сборка подписанного APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Тело релиза из CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Секция нужной версии: от строки «## [X.Y.Z]» до следующего «## [»
          awk -v ver="$VERSION" \
            'index($0, "## [" ver "]") == 1 { found = 1; next }
             found && /^## \[/ { exit }
             found { print }' CHANGELOG.md > body.md
          # Версии нет в чейнжлоге — запасной текст, чтобы релиз не остался без описания
          if [ ! -s body.md ]; then
            echo "Сборка ${GITHUB_REF_NAME}. Подробности — в CHANGELOG.md." > body.md
          fi
          # Убрать пустые строки в конце секции
          printf '%s\n' "$(cat body.md)" > body.tmp && mv body.tmp body.md
          # Ссылка на сравнение с предыдущим тегом — как в автогенерируемых заметках
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            {
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            } >> body.md
          fi

      - name: Публикация GitHub Release (пре-релиз)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          NAME="SmartFridge-${GITHUB_REF_NAME#v}.apk"
          mv "$APK" "build/app/outputs/flutter-apk/$NAME"
          gh release create "$GITHUB_REF_NAME" \
            "build/app/outputs/flutter-apk/$NAME" \
            --title "Умный Холодильник $GITHUB_REF_NAME" \
            --notes-file body.md \
            --prerelease
