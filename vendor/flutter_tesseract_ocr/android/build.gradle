// Вендоренная копия flutter_tesseract_ocr 0.4.31 (BSD-3, см. LICENSE) —
// OCR-1 (v0.6.2): оригинальный build.gradle несовместим с Gradle 9
// (jcenter() удалён; rootProject.allprojects с project(':...') внутри
// вызывал NPE при оценке проекта). Исправления: убран buildscript/
// jcenter (AGP приходит из приложения), flatDir регистрируется на всех
// проектах через захваченную СТРОКУ пути (без project() — Gradle 9
// запрещает кросс-проектный доступ при оценке), lint-блок современный.
group 'io.paratoner.flutter_tesseract_ocr'
version '1.0'

def pluginLibsDir = projectDir.absolutePath + '/libs'

apply plugin: 'com.android.library'

android {
    namespace "io.paratoner.flutter_tesseract_ocr"
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable 'InvalidPackage'
    }
}

repositories {
    flatDir {
        dirs pluginLibsDir
    }
}

// AAR виден и приложению (app его упаковывает) — потому flatDir
// регистрируется на ВСЕХ проектах; inside — только строка пути,
// никаких обращений к project().
rootProject.allprojects {
    repositories {
        flatDir {
            dirs pluginLibsDir
        }
    }
}

// Нативный Tesseract 4 для Android (Apache-2.0, adaptech) —
// вендоренный AAR рядом (android/libs/tesseract4android-release.aar).
dependencies {
    api(name: 'tesseract4android-release', ext: 'aar')
}
