# PLAT-5 (аудит 2026-10-28, v0.6.2): 8G/4G не влезали в GitHub-раннеры
# (7 ГБ RAM) и в слабые локальные машины — демоны свапались/OOM.
# 4G/1G достаточно и для сборки с Tesseract-плагином.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
